  - world_id: conference-world:redteamcua
    source_repo: RedTeamCUA
    conference_signal: ICLR 2026
    domain: adversarial computer-use security
    runtime_substrate: vm_plus_docker_gui_runtime
    state_model: desktop/web app state, adversarial content, user goal, security objective
    action_model: observe GUI, click/type, navigate, handle injected instructions, report outcome
