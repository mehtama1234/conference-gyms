      - browser_functionality_check
      - static_code_check
    trace_and_evidence:
      - screenshot
      - playwright_trace
      - code_diff
      - visual_metric
    source_to_world_extraction: design images and requirements become web implementation tasks
    difficulty_controls:
      - responsive_layout
      - component_hierarchy
      - visual_detail
      - interaction_requirement
    human_feedback_calibration: central for visual fidelity and usability
    training_export: visual-to-web build trajectories
    aidf_next_adapter: browser evidence plus visual rubric adapter

  - world_id: conference-world:miniappbench
    source_repo: MiniAppBench
    conference_signal: ICML 2026
    domain: interactive HTML app generation and evaluation
    runtime_substrate: browser_app_runtime
    state_model: app prompt, generated HTML app, browser state, interaction outcomes
    action_model: create app, inspect DOM, interact with controls, run dynamic checks
    observation_model: screenshots, DOM, console logs, interaction success, static signals
    verifier_stack:
      - static_requirement_check
      - dynamic_browser_check
      - rubric_judge
    trace_and_evidence:
      - generated_app
      - browser_trace
      - interaction_result
      - rubric_score
    source_to_world_extraction: user app requests become executable mini-app benchmark tasks
    difficulty_controls:
      - ambiguous_requirement
      - interaction_depth
      - visual_quality
      - state_persistence
    human_feedback_calibration: important for intent match and visual quality
    training_export: app-building and app-evaluation trajectories
    aidf_next_adapter: deployable-project world generation adapter

  - world_id: conference-world:phyworldbench
    source_repo: PhyWorldBench
    conference_signal: ICLR 2026
    domain: physical realism evaluation for generated worlds/videos
    runtime_substrate: multimodal_generation_eval
    state_model: physical prompt, generated media, physics taxonomy, evaluation labels
    action_model: generate or inspect media, classify physical failures, score realism
