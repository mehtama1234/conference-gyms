  - world_id: conference-world:mc-search
    source_repo: MC-Search
    conference_signal: ICLR 2026
    domain: multimodal multi-hop search and reasoning
    runtime_substrate: multimodal_retrieval_dataset
    state_model: question, subquestions, retrieved evidence, image/text context, answer state
    action_model: decompose question, retrieve text/image, answer subquestion, submit
    observation_model: retrieval results, supporting facts, intermediate answers, verifier feedback
    verifier_stack:
      - hop_wise_attribution
      - process_metric
      - final_answer_metric
    trace_and_evidence:
      - verified_reasoning_chain
      - retrieval_trace
      - supporting_fact_refs
    source_to_world_extraction: QA examples become guided evidence-search worlds
    difficulty_controls:
      - hop_count
      - distractor_evidence
      - modality_dependency
      - subquestion_branching
    human_feedback_calibration: useful for evidence sufficiency and attribution review
    training_export: process-supervised search trajectories
    aidf_next_adapter: evidence graph and retrieval-trace adapter

  - world_id: conference-world:terminaltraj
    source_repo: TerminalTraj
    conference_signal: ICML 2026
    domain: dockerized terminal-agent trajectories
    runtime_substrate: docker_terminal_instances
    state_model: terminal instance, filesystem, command history, validator state
    action_model: run commands, edit files, inspect output, validate result
    observation_model: terminal output, filesystem diff, validator result, task metadata
    verifier_stack:
      - executable_validator
      - terminal_task_check
      - trace_quality_check
    trace_and_evidence:
      - terminal_agent_trajectory
