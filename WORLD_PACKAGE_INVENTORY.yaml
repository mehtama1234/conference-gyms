    observation_model: device readings, event logs, time updates, task success state
    verifier_stack:
      - device_state_check
      - schedule_constraint_check
      - safety_policy_check
    trace_and_evidence:
      - device_api_trace
      - time_event_log
      - state_snapshot_diff
    source_to_world_extraction: home/device/task specs become smart-home episodes
    difficulty_controls:
