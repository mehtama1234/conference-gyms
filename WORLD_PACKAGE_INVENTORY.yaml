schema_version: aidf.conference_world_inventory.v0
purpose: >
  Structured first-pass map from local ICML/ICLR-style benchmark repos to AIDF
  world-package concepts. This complements CONFERENCE_WORLD_ANALYSIS.md,
  WORLD_ANATOMY_MAP.md, and AIDF_WORLD_IMPLEMENTATION_GAPS.md.

aidf_extraction_fields:
  - world_id
  - source_repo
  - conference_signal
  - domain
  - runtime_substrate
  - state_model
  - action_model
  - observation_model
  - verifier_stack
  - trace_and_evidence
  - source_to_world_extraction
  - difficulty_controls
  - human_feedback_calibration
  - training_export
  - aidf_next_adapter

worlds:
  - world_id: conference-world:tau2-bench
    source_repo: tau2-bench
    conference_signal: ICML 2026
    domain: customer-service shared-state work
    runtime_substrate: python_gymnasium_or_domain_runtime
    state_model: domain customer, policy, tool, and conversation state
    action_model: agent tool calls plus simulated user actions over shared state
    observation_model: conversation turns, tool outputs, user replies, state feedback
    verifier_stack:
      - state_inspection
      - policy_compliance
      - task_grader
    trace_and_evidence:
      - conversation_trace
      - tool_call_trace
      - final_state_diff
    source_to_world_extraction: policies, tools, tasks, and domain records become scenarios
    difficulty_controls:
      - shared_control
      - policy_constraints
      - user_ambiguity
      - multi_turn_dependency
    human_feedback_calibration: useful for policy and process rubric review
    training_export: agent/user/tool trajectories
    aidf_next_adapter: dual-control enterprise world adapter

  - world_id: conference-world:bird-interact
    source_repo: BIRD-Interact
    conference_signal: ICLR 2026
    domain: interactive database and text-to-SQL work
    runtime_substrate: docker_database_runtime
    state_model: relational database plus task and user-simulator context
    action_model: SQL, CRUD, exploration, clarification, and user interaction
    observation_model: query results, errors, user replies, and environment feedback
    verifier_stack:
      - executable_sql_check
      - state_inspection
      - task_success_metric
    trace_and_evidence:
      - query_trace
      - database_result
      - user_simulator_dialogue
    source_to_world_extraction: database schema, data, and task intents become executable worlds
    difficulty_controls:
      - hidden_schema_dependency
      - clarification_need
      - multi_step_database_update
    human_feedback_calibration: optional for ambiguous user intents
    training_export: query-and-dialogue trajectories
    aidf_next_adapter: database connector simulator plus verifier adapter

  - world_id: conference-world:cybergym
    source_repo: CyberGym
    conference_signal: ICLR 2026
    domain: vulnerability analysis and patch verification
    runtime_substrate: sandboxed_codebase_runtime
    state_model: vulnerable repository, exploit condition, patch state, and test state
    action_model: inspect code, run commands, modify files, generate or validate PoC
    observation_model: terminal output, files, test logs, exploit behavior
    verifier_stack:
      - exploit_reproduction
      - regression_test
      - patch_effect_check
    trace_and_evidence:
      - terminal_command_output
      - file_diff
      - pre_post_verifier_log
    source_to_world_extraction: CVE or issue source becomes runnable vulnerable task
    difficulty_controls:
      - larger_codebase
      - indirect_exploit_path
      - noisy_failing_tests
    human_feedback_calibration: limited; mostly executable verifier driven
    training_export: repair and exploit-validation trajectories
    aidf_next_adapter: security world replay adapter

  - world_id: conference-world:menvagent
    source_repo: MEnvAgent
    conference_signal: ICML 2026
    domain: software environment construction
    runtime_substrate: docker_environment_builder
    state_model: dependency files, build scripts, runtime image, repair history
    action_model: infer setup, install dependencies, build container, run validation
    observation_model: build logs, package errors, test outputs, environment metadata
    verifier_stack:
      - build_success
      - smoke_test
      - task_validation
    trace_and_evidence:
      - dockerfile
      - setup_log
      - repair_trace
      - validation_output
    source_to_world_extraction: repo metadata and task files become reproducible runtime package
    difficulty_controls:
      - missing_dependency
      - version_conflict
      - polyglot_runtime
    human_feedback_calibration: useful for setup-quality rubric
    training_export: environment-repair trajectories
    aidf_next_adapter: source-intake to executable environment builder

  - world_id: conference-world:agent-data-protocol
    source_repo: Agent-Data-Protocol
    conference_signal: ICLR 2026
    domain: agent trajectory interchange
    runtime_substrate: data_protocol
    state_model: normalized tasks, observations, actions, and messages
    action_model: schema-level action representation, not a single runtime action set
    observation_model: standardized observations and tool outputs
    verifier_stack:
      - schema_validation
      - conversion_invariant
      - dataset_quality_check
    trace_and_evidence:
      - normalized_trace
      - raw_trace
      - trainable_transcript
    source_to_world_extraction: raw traces become standardized agent data
    difficulty_controls:
      - dataset_filter
      - trace_quality
      - observation_noise
    human_feedback_calibration: supports labeled examples but is not itself a judge
    training_export: primary purpose; SFT and trajectory conversions
    aidf_next_adapter: canonical AIDF trace export target

  - world_id: conference-world:astabench
    source_repo: AstaBench
    conference_signal: ICLR 2026
    domain: scientific research-agent workflows
    runtime_substrate: tool_and_data_research_runtime
    state_model: research tasks, data assets, tool calls, costs, and submissions
    action_model: use research tools, inspect data, compute, cite, submit answer
    observation_model: tool outputs, documents, data, cost receipts, scorer feedback
    verifier_stack:
      - task_scorer
      - citation_or_evidence_check
      - cost_accounting
    trace_and_evidence:
      - tool_trace
      - cited_evidence
      - scoring_log
      - cost_usage
    source_to_world_extraction: research questions and assets become benchmark tasks
    difficulty_controls:
      - tool_budget
      - evidence_depth
      - multi_source_dependency
    human_feedback_calibration: useful for scientific rubric and citation quality
    training_export: research-agent trajectories with cost and evidence labels
    aidf_next_adapter: scientific work package and cost-aware verifier adapter

  - world_id: conference-world:webdevjudge
    source_repo: WebDevJudge
    conference_signal: ICLR 2026
    domain: web-development judgment
    runtime_substrate: browser_and_static_analysis_runtime
    state_model: task prompt, generated site/app, human labels, judge decisions
    action_model: inspect code, render page, interact with UI, score dimensions
    observation_model: DOM, screenshots, interaction results, static signals
    verifier_stack:
      - browser_evidence
      - rubric_judge
      - human_preference_label
    trace_and_evidence:
      - screenshot
      - interaction_trace
      - rubric_item
      - human_label
    source_to_world_extraction: app requirements and examples become evaluation tasks
    difficulty_controls:
      - visual_fidelity
      - interaction_depth
      - ambiguous_requirement
    human_feedback_calibration: central capability
    training_export: rubric-labeled web-development examples
    aidf_next_adapter: reviewer calibration and browser evidence adapter

  - world_id: conference-world:realpdebench
    source_repo: RealPDEBench
    conference_signal: ICLR 2026
    domain: scientific physical-system modeling
    runtime_substrate: scientific_simulator_plus_real_measurements
    state_model: real measurements, PDE simulation parameters, predictions, metrics
    action_model: configure simulation, run model, compare against real system
    observation_model: numerical outputs, plots, metric tables, sim-to-real gaps
    verifier_stack:
      - numerical_metric
      - simulator_metric
      - real_measurement_comparison
    trace_and_evidence:
      - simulation_config
      - metric_output
      - plot_or_table
    source_to_world_extraction: experiment descriptions and data become simulation tasks
    difficulty_controls:
      - parameter_shift
      - sparse_measurement
      - sim_to_real_gap
    human_feedback_calibration: expert review useful for scientific validity
    training_export: simulation-and-metric trajectories
    aidf_next_adapter: scientific simulator substrate contract

  - world_id: conference-world:causalgame
    source_repo: CausalGame
    conference_signal: ICML 2026
    domain: causal discovery through active experimentation
    runtime_substrate: interactive_scientific_game
    state_model: hidden causal graph, interventions, observations, budget
    action_model: choose experiments, intervene, observe, update hypothesis
    observation_model: noisy measurements, censored signals, experiment results
    verifier_stack:
      - hidden_graph_match
      - experiment_efficiency
      - final_hypothesis_score
    trace_and_evidence:
      - experiment_log
      - observation_table
      - hypothesis_updates
    source_to_world_extraction: causal system specification becomes hidden-state game
    difficulty_controls:
      - confounding
      - noise
      - intervention_budget
      - hidden_variable
    human_feedback_calibration: useful for rubric over experimental strategy
    training_export: active-learning trajectories
    aidf_next_adapter: hidden-state scientific discovery world

  - world_id: conference-world:ui-venus-mobile
    source_repo: UI-Venus-VenusBench-Mobile
    conference_signal: ICML 2026
    domain: mobile GUI computer-use tasks
    runtime_substrate: android_mobile_emulator
    state_model: app screen state, user goal, device context, action history
    action_model: tap, type, scroll, navigate, inspect UI
    observation_model: screenshot, accessibility tree, app state, action result
    verifier_stack:
      - ui_state_check
      - task_completion_check
      - capability_diagnostic
    trace_and_evidence:
      - screenshot
      - accessibility_tree
      - input_action_trace
    source_to_world_extraction: mobile app tasks and intents become benchmark episodes
    difficulty_controls:
      - layout_variation
      - multi_app_dependency
      - visual_ambiguity
    human_feedback_calibration: useful for intent and visual quality judgments
    training_export: mobile computer-use trajectories
    aidf_next_adapter: mobile/GUI world substrate adapter

  - world_id: conference-world:swing-bench
    source_repo: Swing-Bench
    conference_signal: ICLR 2026
    domain: repository issue resolution
    runtime_substrate: repository_plus_ci
    state_model: issue, repository, branch, tests, reviewer/submission state
    action_model: inspect code, edit files, run tests, submit patch
    observation_model: file contents, terminal output, CI logs, review feedback
    verifier_stack:
      - unit_test_or_ci
      - patch_diff_check
      - reviewer_feedback
    trace_and_evidence:
      - git_diff
      - test_log
      - ci_result
      - review_comment
    source_to_world_extraction: issue and repo snapshot become executable coding task
    difficulty_controls:
      - large_repo_context
      - flaky_or_slow_ci
      - underspecified_issue
    human_feedback_calibration: reviewer feedback and acceptance criteria
    training_export: code-agent repair trajectories
    aidf_next_adapter: software-development work-world adapter

  - world_id: conference-world:world-in-world
    source_repo: World-In-World
    conference_signal: ICLR 2026
    domain: embodied closed-loop world-model evaluation
    runtime_substrate: embodied_simulator_or_world_model
    state_model: scene, agent pose, future observations, task goal
    action_model: move, inspect, manipulate, plan across predicted state
    observation_model: generated or simulated visual observations and success state
    verifier_stack:
      - simulator_metric
      - task_success_check
      - trajectory_consistency
    trace_and_evidence:
      - action_sequence
      - generated_observation
      - success_metric
    source_to_world_extraction: scenes and task goals become embodied episodes
    difficulty_controls:
      - longer_planning_horizon
      - partial_observability
      - scene_complexity
    human_feedback_calibration: possible for realism and task validity
    training_export: planning and embodied interaction trajectories
    aidf_next_adapter: embodied/world-model runtime abstraction

  - world_id: conference-world:gaia2-are
    source_repo: Gaia2-ARE
    conference_signal: ICLR 2026
    domain: dynamic asynchronous general-agent environments
    runtime_substrate: python_environment_runner
    state_model: scenario state, dynamic events, tool state, time budget, hidden task context
    action_model: observe state, call tools, respond, wait, recover from event changes
    observation_model: environment events, tool outputs, scenario updates, verifier feedback
    verifier_stack:
      - action_level_verifier
      - scenario_score
      - temporal_constraint_check
    trace_and_evidence:
      - environment_event_log
      - tool_trace
      - action_verifier_result
    source_to_world_extraction: scenario definitions and tool specs become async work episodes
    difficulty_controls:
      - delayed_event
      - changing_context
      - temporal_constraint
      - tool_failure
    human_feedback_calibration: useful for ambiguous strategy and partial-credit process review
    training_export: async tool-use trajectories
    aidf_next_adapter: dynamic long-horizon environment loop adapter

  - world_id: conference-world:openapps
    source_repo: OpenApps
    conference_signal: ICLR 2026
    domain: configurable UI app computer-use tasks
    runtime_substrate: browser_ui_runtime
    state_model: app config, screen state, DOM/UI state, task goal, action history
    action_model: click, type, scroll, navigate, inspect, submit
    observation_model: screenshot, DOM or accessibility state, action results, task feedback
    verifier_stack:
      - ui_state_check
      - task_completion_check
      - robustness_across_variants
    trace_and_evidence:
      - screenshot_sequence
      - ui_action_trace
      - app_state_diff
    source_to_world_extraction: app configs and task goals become UI-world variants
    difficulty_controls:
      - layout_variation
      - content_variation
      - visual_ambiguity
      - navigation_depth
    human_feedback_calibration: useful for visual/task intent judgments
    training_export: computer-use trajectories across app variants
    aidf_next_adapter: browser UI world variant adapter

  - world_id: conference-world:medagentgym
    source_repo: MedAgentGym
    conference_signal: ICLR 2026
    domain: biomedical coding and data-science tasks
    runtime_substrate: biomedical_sandbox_runtime
    state_model: task spec, biomedical dataset, code workspace, execution feedback, ground truth
    action_model: read task, write code, run code, inspect feedback, submit answer
    observation_model: dataset samples, execution logs, feedback signals, validation result
    verifier_stack:
      - sandbox_ground_truth
      - code_execution_check
      - biomedical_task_metric
    trace_and_evidence:
      - code_trace
      - execution_log
      - feedback_trace
      - ground_truth_result
    source_to_world_extraction: biomedical tasks and datasets become executable coding worlds
    difficulty_controls:
      - domain_specific_data
      - sparse_feedback
      - noisy_measurement
      - dependency_setup
    human_feedback_calibration: expert review needed before clinical or biomedical claims
    training_export: biomedical code-agent trajectories
    aidf_next_adapter: gated-data scientific coding world adapter

  - world_id: conference-world:sandbox-escape-bench
    source_repo: SandboxEscapeBench
    conference_signal: ICML 2026
    domain: sandbox security and infrastructure-risk evaluation
    runtime_substrate: isolated_vm_or_inspect_ai_runtime
    state_model: sandbox scenario, VM/container boundary, command state, flag or success condition
    action_model: inspect environment, run commands, attempt task, report flag or failure
    observation_model: terminal output, sandbox state, scenario metadata, scoring result
    verifier_stack:
      - inspect_task_score
      - sandbox_boundary_check
      - transcript_analysis
    trace_and_evidence:
      - inspect_eval_log
      - terminal_transcript
      - sandbox_state_receipt
    source_to_world_extraction: scenario files become isolated security evaluation tasks
    difficulty_controls:
      - sandbox_hardening_level
      - command_surface
      - network_policy
      - privilege_boundary
    human_feedback_calibration: security expert review useful for severity and exploitability
    training_export: security-sensitive transcripts only after policy review
    aidf_next_adapter: chaos/security sandbox evaluation adapter

  - world_id: conference-world:cve-factory
    source_repo: CVE-Factory
    conference_signal: ICML 2026
    domain: security world generation from CVE sources
    runtime_substrate: docker_in_docker_world_factory
    state_model: CVE metadata, vulnerable repo, generated task, tests, agent traces, verifier result
    action_model: read CVE, build environment, generate tests, judge task, export world package
    observation_model: CVE fields, build logs, test logs, generated task review, benchmark result
    verifier_stack:
      - generated_security_task_tests
      - patch_eval
      - exploit_or_regression_check
    trace_and_evidence:
      - factory_stage_log
      - generated_test_log
      - distilled_agent_trace
    source_to_world_extraction: CVE descriptions and repos become runnable vulnerability worlds
    difficulty_controls:
      - repo_size
      - exploit_complexity
      - test_synthesis_quality
      - stale_dependency
    human_feedback_calibration: security expert review needed for task validity
    training_export: generated security tasks and distilled traces
    aidf_next_adapter: security source-to-world factory adapter

  - world_id: conference-world:agentflow
    source_repo: AgentFlow
    conference_signal: ICLR 2026
    domain: planner-executor-verifier agent training loop
    runtime_substrate: agent_training_runtime
    state_model: plan state, executor state, verifier feedback, generated trajectories, reward signal
    action_model: plan, execute, verify, generate, update planner policy
    observation_model: module outputs, verifier feedback, trajectory reward, training logs
    verifier_stack:
      - task_verifier
      - trajectory_level_reward
      - planner_executor_consistency
    trace_and_evidence:
      - planner_trace
      - executor_trace
      - verifier_trace
      - training_log
    source_to_world_extraction: tasks and verifier feedback become trainable agent-loop episodes
    difficulty_controls:
      - verifier_noise
      - plan_depth
      - executor_failure
      - reward_sparsity
    human_feedback_calibration: useful for validating process rewards
    training_export: planner/executor/verifier traces
    aidf_next_adapter: harness improvement-loop and training-export adapter

  - world_id: conference-world:algoveri
    source_repo: AlgoVeri
    conference_signal: ICML 2026
    domain: cross-tool algorithm verification
    runtime_substrate: formal_methods_toolchain
    state_model: algorithm spec, implementation, proof obligations, toolchain result
    action_model: write or repair code, write proof annotations, run verifier, inspect failures
    observation_model: compiler output, proof errors, counterexamples, pass/fail result
    verifier_stack:
      - formal_verifier
      - proof_obligation_check
      - cross_tool_consistency
    trace_and_evidence:
      - source_diff
      - verifier_log
      - proof_error_trace
    source_to_world_extraction: algorithm contracts become Dafny/Verus/Lean verification tasks
    difficulty_controls:
      - invariant_complexity
      - toolchain_difference
      - proof_gap
    human_feedback_calibration: expert review useful for proof strategy quality
    training_export: formal-code repair trajectories
    aidf_next_adapter: formal verification world adapter

  - world_id: conference-world:verina
    source_repo: VERINA
    conference_signal: ICLR 2026
    domain: Lean verifiable-code generation
    runtime_substrate: lean_toolchain
    state_model: natural-language task, Lean spec, implementation, proof state, theorem result
    action_model: write code, write proof, run Lean, inspect proof errors, repair
    observation_model: Lean diagnostics, proof state, compile result, test or theorem result
    verifier_stack:
      - lean_compile_check
      - theorem_proof_check
      - intermediate_artifact_score
    trace_and_evidence:
      - lean_file_diff
      - proof_state_log
      - compiler_output
    source_to_world_extraction: code/spec/proof tasks become verifiable formal worlds
    difficulty_controls:
      - theorem_depth
      - missing_lemma
      - proof_search_branching
    human_feedback_calibration: useful for proof decomposition quality
    training_export: Lean code/proof trajectories
    aidf_next_adapter: Lean verifier and formal artifact adapter

  - world_id: conference-world:vision2web
    source_repo: Vision2Web
    conference_signal: ICML 2026
    domain: visual website development
    runtime_substrate: browser_and_web_build_runtime
    state_model: visual target, app source, rendered DOM, screenshots, interaction state
    action_model: inspect image, edit web files, run app, interact, submit implementation
    observation_model: rendered screenshot, DOM, Playwright results, visual comparison signals
    verifier_stack:
